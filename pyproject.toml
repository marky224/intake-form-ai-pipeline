[project]
name = "intake-form-ai-pipeline"
version = "0.1.0"
description = "Self-improving intake-form processing pipeline with three-tier extraction cascade, BAA-aware routing, and F1-over-time eval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mark Marquez", email = "me@markandrewmarquez.com" },
]
keywords = ["llm", "ocr", "extraction", "cascade", "hipaa", "pydantic", "aws"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Private :: Do Not Upload",
]

dependencies = [
    "pydantic>=2.6",
    # numpy backs the Phase 8 RAG layer: multivector embedding (de)serialization
    # in rag/store.py and the brute-force late-interaction MaxSim in
    # rag/retrieve.py — both on the default cached/$0 path, so numpy must be a
    # real (not lazy) runtime dep that `uv sync --frozen` installs in CI. The
    # heavy retrieval model (ColQwen via colpali-engine) stays undeclared +
    # lazy-imported like paddlepaddle-gpu — only the small array math is here.
    "numpy>=1.26",
]

# Tier 1 (Phase 4 PR (a+b)) needs `paddlepaddle-gpu` + `paddleocr` for live
# inference. NOT declared as a project optional-extra because PaddlePaddle
# 3.x (the version PaddleOCR-VL-1.5 requires) ships from PaddlePaddle's own
# index URL — not PyPI — and uv's dependency resolver can't reconcile that
# automatically without per-package index overrides. CI exercises Tier 1 via
# cached eval-fixtures only (the live import path is lazy-imported inside
# the provider). Manual install on the GPU build machine — see
# `docs/local-development.md` "Tier 1 PaddleOCR-VL setup" for the curl-from-
# Paddle-index commands.

# ruff and black are pinned to the same exact versions as
# .pre-commit-config.yaml. CI runs `uv sync --frozen` then ruff/black, so the
# dev-deps and pre-commit hooks must agree on tool version. Bump both files
# together when modernizing tooling.
#
# jinja2 + playwright are the synthetic-data renderer's deps (Phase 3 PR (b)).
# jinja2 templates the CMS-1500 HTML; playwright drives the headless Chromium
# that rasterizes each form to PNG. Playwright tests are marked `slow` and
# skipped in CI (CI does not install the Chromium binary).
#
# (boto3 + moto were the Phase 3 PR (c) S3 uploader's deps. The V1
# local-first pivot refactored `synthetic_data/render/upload.py` to a
# local filesystem store — no AWS, no boto3/moto. The S3 implementation
# is the V2 target; boto3/moto return when V2 restores the uploader.)
#
# pypdfium2 + Pillow are the Phase 3.5 DocILE PDF -> PNG rasterizer's deps.
# pypdfium2 is a pure-wheel binding for PDFium (Chrome's PDF engine) — bundles
# the native binary, no system Poppler/Cairo install required. Pillow handles
# the PNG encoding from the rendered bitmap (pypdfium2 hands off via .to_pil()).
# Used at 200 DPI to keep DocILE bbox coords round-trip cleanly with the
# upstream metadata's `page_sizes_at_200dpi`.
#
# ollama is the Tier 2 (Phase 4 PR (c-V1)) Qwen 2.5 VL 7B client. Unlike Tier
# 1's paddlepaddle-gpu (non-PyPI 3.x index, hence undeclared + manual install),
# the `ollama` client is a trivial pure-Python HTTP wrapper on PyPI — safe to
# declare and pin. The provider still lazy-imports it inside the client loader
# (mirrors Tier 1's structure; module stays importable if the dep is absent).
# >=0.4 floor: client-side structured-output `format=<json-schema>` support
# (the Tier 2 schema-constrained decoding strategy) landed in the 0.4 line.
# CI exercises Tier 2 via cached eval-fixtures only; the live Ollama call is
# gated behind EVAL_LIVE + @pytest.mark.slow and never runs in CI.
#
# streamlit is the Phase 7-V1 local demo's UI (`just demo`). The demo's
# cascade-run + two-stage-F1 logic lives in `demo/data.py` and is unit-tested
# WITHOUT importing streamlit (CI never imports streamlit); `demo/app.py` is
# the thin Streamlit view layer, run only locally on `openclaw-pc`. The demo
# drives the cascade through the default cached-replay path ($0, no GPU).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.7.4",
    "black==24.10.0",
    "pre-commit>=4.0",
    "jinja2>=3.1",
    "playwright>=1.40",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "ollama>=0.4",
    "streamlit>=1.40",
]

# Treat the repo as an application, not a library: uv won't try to build/install
# the root as a package. Phase 4 may revisit this when src/intake_pipeline/ lands
# and the cascade orchestrator becomes importable code rather than a flat layout.
[tool.uv]
package = false
default-groups = ["dev"]

# ---- Ruff ----------------------------------------------------------------
# Line length aligned with black so the two formatters agree. Pre-commit runs
# ruff-fix → ruff-format → black; if they ever disagree, black wins last.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "synthetic_data/output",
    "evals/results",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line-too-long — black handles wrapping; ruff would double-flag
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["B011"]  # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---- Black ---------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    \.venv
  | build
  | dist
  | synthetic_data/output
  | evals/results
)/
'''

# ---- Pytest --------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
python_files = ["test_*.py"]
testpaths = ["tests"]
# First-party packages live at the repo root (flat layout, no src/); the test
# suite lives under tests/. pythonpath keeps `import intake_schemas`,
# `from cascade import ...`, etc. resolvable regardless of where pytest is run.
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "-ra",
]
markers = [
    "live: tests that hit real cloud providers (gated on EVAL_LIVE=true)",
    "slow: tests that exceed ~1s per case",
]
