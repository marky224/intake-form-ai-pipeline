name: CI

# Triggers: every PR (any branch) and pushes to main.
# Branch protection on main should require this workflow to pass before merge.
on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs on the same PR to save CI minutes when commits land
# in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: black check
        run: uv run black --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      # Tests run with cached fixtures only; live cloud calls are blocked
      # in CI. EVAL_LIVE must NEVER be set in CI workflows.
      - name: Run pytest
        run: uv run pytest -v --tb=short
        env:
          EVAL_LIVE: "false"

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip the terraform job entirely if no .tf files exist yet (e.g., during
    # very early Phase 1 commits). Once infra/terraform/ has real content this
    # check becomes the gate for IaC quality.
    if: hashFiles('infra/terraform/**/*.tf') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate
