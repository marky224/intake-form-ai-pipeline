name: CI

# Triggers: every PR (any branch) and pushes to main.
# Branch protection on main should require this workflow to pass before merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: black check
        run: uv run black --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Tests run with cached fixtures only; live cloud calls are blocked
      # in CI. EVAL_LIVE must NEVER be set in CI workflows.
      - name: Run pytest
        run: uv run pytest -v --tb=short
        env:
          EVAL_LIVE: "false"
