name: CI

# Triggers: every PR (any branch) and pushes to main.
# Branch protection on main should require this workflow to pass before merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: black check
        run: uv run black --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Tests run with cached fixtures only; live cloud calls are blocked
      # in CI. EVAL_LIVE must NEVER be set in CI workflows.
      - name: Run pytest
        run: uv run pytest -v --tb=short
        env:
          EVAL_LIVE: "false"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # gitleaks scans commit history; needs full clone, not just HEAD.
          fetch-depth: 0

      # gitleaks-action is free for public repos owned by individual accounts;
      # GITLEAKS_LICENSE is only required for organization-owned repos.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    name: IaC scan (checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Scans both bootstrap and main Terraform stacks. Inline suppressions
      # via `# checkov:skip=CKV_AWS_xxx:reasoning` keep findings auditable.
      # Blanket --skip-check should be reserved for project-wide false
      # positives with documented justification.
      - name: Run checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra/terraform
          framework: terraform
          # Project-wide skips live in .checkov.yaml at repo root. Inline
          # `# checkov:skip=...` comments handle resource-specific cases.
          config_file: .checkov.yaml
          # Hermetic scan — don't fetch external modules over the network.
          download_external_modules: "false"
          quiet: true
          output_format: cli

  terraform:
    name: Terraform (fmt + validate + plan/apply)
    # IaC scan gates the deploy path. Secret-scan is intentionally not in
    # `needs:` — it's a PR-merge gate via branch protection, not a deploy
    # gate, so a secret leak doesn't block valid Terraform operations.
    needs: [lint, test, iac-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    # Secrets cannot be referenced in step-level `if:` conditions per GitHub
    # docs; the documented workaround is to expose them as job-level env vars
    # first, then check `env.X != ''` in if. The env values inherit the secret
    # mask, so they remain `***`-masked in workflow logs.
    env:
      AWS_OIDC_ROLE_ARN_DEPLOY: ${{ secrets.AWS_OIDC_ROLE_ARN_DEPLOY }}
      AWS_OIDC_ROLE_ARN_PLAN: ${{ secrets.AWS_OIDC_ROLE_ARN_PLAN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      # fmt + validate are offline checks — run unconditionally against
      # both stacks. Catch formatting/syntax issues even before OIDC is
      # wired up.
      - name: Terraform fmt check (recursive)
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform validate (bootstrap)
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/terraform/bootstrap

      - name: Terraform validate (main)
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/terraform

      # OIDC: pick the role to assume based on event type. Pull requests
      # use the plan role (read-only). Pushes to main use the deploy role
      # (write perms). Both gates are conditioned on the repo secrets
      # being set; if a fork PR or a fresh clone runs CI without secrets
      # configured, fmt/validate still gate the PR while these steps skip.
      #
      # Role ARNs and the state-bucket name are stored as repo SECRETS
      # (not variables) because they embed the AWS account ID. Secrets
      # are auto-masked everywhere they appear in workflow logs; variables
      # are not. `mask-aws-account-id: true` adds a second mask layer so
      # the account ID itself gets masked in subsequent log output (e.g.,
      # `aws sts get-caller-identity` JSON, Terraform refresh lines).
      - name: Configure AWS credentials (OIDC)
        if: env.AWS_OIDC_ROLE_ARN_DEPLOY != '' && env.AWS_OIDC_ROLE_ARN_PLAN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && env.AWS_OIDC_ROLE_ARN_PLAN || env.AWS_OIDC_ROLE_ARN_DEPLOY }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Verify OIDC chain
        if: env.AWS_OIDC_ROLE_ARN_DEPLOY != '' && env.AWS_OIDC_ROLE_ARN_PLAN != ''
        run: aws sts get-caller-identity

      # Main-stack plan/apply against the S3 backend. Backend bucket
      # name is a secret (embeds the account ID); lock table is a
      # variable (no account ID).
      - name: Terraform init (main, S3 backend)
        if: env.TF_STATE_BUCKET != '' && vars.TF_LOCK_TABLE != '' && env.AWS_OIDC_ROLE_ARN_DEPLOY != '' && env.AWS_OIDC_ROLE_ARN_PLAN != ''
        run: |
          rm -rf .terraform
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=main/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
        working-directory: infra/terraform

      # Plan-only on PRs. -lock=false because the plan role has
      # ReadOnlyAccess and can't acquire a DynamoDB lock; safe because
      # plan is read-only. Guard must match the init step exactly so
      # plan never runs against a local backend if init was skipped.
      - name: Terraform plan (main, PR)
        if: github.event_name == 'pull_request' && env.TF_STATE_BUCKET != '' && vars.TF_LOCK_TABLE != '' && env.AWS_OIDC_ROLE_ARN_DEPLOY != '' && env.AWS_OIDC_ROLE_ARN_PLAN != ''
        run: terraform plan -lock=false -no-color
        working-directory: infra/terraform

      # Apply on push to main only. The deploy role acquires the lock
      # normally. Guard must match the init step exactly so apply never
      # runs against a local backend if init was skipped.
      #
      # SAFETY BRAKE: gated on `vars.TF_APPLY_ENABLED` being the literal
      # string `'true'`. The brake exists because the AWS account hosts
      # other projects, so any CI apply has cross-project blast radius
      # if the deploy role is over-scoped. Phase 2 PR 3 narrowed the
      # role's S3 access to this project's buckets and added the
      # DynamoDB lock-table allow; once that PR is merged AND the
      # bootstrap stack has been re-applied locally (the live IAM role
      # only updates on bootstrap re-apply, not on PR merge), lift the
      # brake with `gh variable set TF_APPLY_ENABLED --body "true"`.
      # Strict `== 'true'` (not `!= ''`) so `TF_APPLY_ENABLED=false`
      # disables instead of enabling — the string `'false'` is non-empty.
      - name: Terraform apply (main, push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.TF_STATE_BUCKET != '' && vars.TF_LOCK_TABLE != '' && env.AWS_OIDC_ROLE_ARN_DEPLOY != '' && env.AWS_OIDC_ROLE_ARN_PLAN != '' && vars.TF_APPLY_ENABLED == 'true'
        run: terraform apply -auto-approve -no-color
        working-directory: infra/terraform
