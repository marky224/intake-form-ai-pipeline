name: CI

# Triggers: every PR (any branch) and pushes to main.
# Branch protection on main should require this workflow to pass before merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: black check
        run: uv run black --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Tests run with cached fixtures only; live cloud calls are blocked
      # in CI. EVAL_LIVE must NEVER be set in CI workflows.
      - name: Run pytest
        run: uv run pytest -v --tb=short
        env:
          EVAL_LIVE: "false"

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Gated: only runs once .tf files exist anywhere under infra/terraform/.
    # PR 1 lands the bootstrap stack, which trips this gate.
    if: hashFiles('infra/terraform/**/*.tf') != ''
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      # fmt + validate are offline checks — run unconditionally. Catch
      # formatting/syntax issues even before the OIDC chain is wired up.
      - name: Terraform fmt check (recursive)
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform validate (bootstrap)
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/terraform/bootstrap

      # OIDC chain check is gated on the repo variable being set. The bootstrap
      # stack creates the role; the operator runs `gh variable set
      # AWS_OIDC_ROLE_ARN ...` after `terraform apply`. Until that lands, these
      # steps are skipped (not failed) so fmt/validate still gate the PR.
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_OIDC_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify OIDC chain
        if: vars.AWS_OIDC_ROLE_ARN != ''
        run: aws sts get-caller-identity
