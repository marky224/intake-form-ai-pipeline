# Dependabot config — keeps pinned GitHub Action SHAs current.
#
# Why only github-actions is configured here: the remote pre-commit hooks
# (pre-commit-hooks, pre-commit-terraform, gitleaks) are pinned in
# .pre-commit-config.yaml and bumped with `pre-commit autoupdate`; ruff and
# black run from uv.lock, so they have no hook rev. Dependabot still opens uv
# PRs for security updates (enabled in the repo settings, not in this file);
# they update uv.lock, and pyproject.toml too when the package is pinned there
# (ruff, black).
#
# Grouped: a single weekly PR bumps all action SHAs together rather than one
# PR per action. Reduces review churn given the slow cadence of action updates.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"
