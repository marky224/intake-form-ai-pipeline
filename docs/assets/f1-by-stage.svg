<text x="70" y="296.0" font-size="11.5" fill="#555">Cells resolved by tier ≤ N (cumulative), by the tier whose value was kept. Tier 1's</text>
<text x="70" y="312.0" font-size="11.5" fill="#555">336 cells are the dates, ZIPs and states that passed validation. Tier 3 re-reads every Tier-2</text>
<text x="70" y="328.0" font-size="11.5" fill="#555">field; its value is kept where the readings differ, it read something, and Tier 2's</text>
