<text x="70" y="674.0" font-size="11.5" fill="#555">Tier 1 finalizes a date, ZIP or state that passes its validator; the 7B</text>
<text x="70" y="690.0" font-size="11.5" fill="#555">re-reads the rest and replaces many right Tier-1 reads (Tier 1+2 dips).</text>
<text x="70" y="706.0" font-size="11.5" fill="#555">Tier 3 re-reads every Tier-2 field; agreement sets confidence, a mismatch</text>
<text x="70" y="722.0" font-size="11.5" fill="#555">parks and keeps Tier 2's value if it validates, else Tier 3's. Most of</text>
<text x="70" y="738.0" font-size="11.5" fill="#555">Tier 3's gain is Synthea's number-suffixed names, offset by street</text>
<text x="70" y="754.0" font-size="11.5" fill="#555">addresses (-37). One template; rules chosen after test results were seen.</text>
<text x="690" y="770" text-anchor="end" font-size="11" fill="#999">alias_table_seed v1.1.0</text>
