<rect x="535.0" y="474.4" width="103.3" height="153.6" fill="#d62728"/>
<text x="586.7" y="466.4" text-anchor="middle" font-size="13" font-weight="bold" fill="#d62728">0.768</text>
<text x="586.7" y="650.0" text-anchor="middle" font-size="13" fill="#333">Tier 1+2+3</text>
<text x="18" y="528.0" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 18 528.0)">F1 (micro)</text>
<text x="70" y="674.0" font-size="11.5" fill="#555">Tier 3 only re-extracts fields that escalated (confidence &lt; 0.80).</text>
<text x="70" y="690.0" font-size="11.5" fill="#555">The locked 0.5-confidence heuristic on coerced scalars forces every</text>
<text x="70" y="706.0" font-size="11.5" fill="#555">date field to escalate even when Tier 2 had it right — and the</text>
<text x="70" y="722.0" font-size="11.5" fill="#555">Q4_K_M 32B re-extracts those dates worse than the 7B, overwriting</text>
<text x="70" y="738.0" font-size="11.5" fill="#555">correct values (29/31 changed fields: correct → wrong, ~all dates).</text>
<text x="70" y="754.0" font-size="11.5" fill="#555">Shipped honest: motivates the local Qwen3-VL Tier-3b upgrade.</text>
<text x="690" y="770" text-anchor="end" font-size="11" fill="#999">alias_table_seed v1.0.0</text>
