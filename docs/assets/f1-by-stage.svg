<text x="70" y="706.0" font-size="11.5" fill="#555">Cells resolved by tier ≤ N (cumulative). Tier 3 only ever finalizes the</text>
<text x="70" y="722.0" font-size="11.5" fill="#555">residual the earlier tiers couldn't clear (the forced-escalated dates), so</text>
<text x="70" y="738.0" font-size="11.5" fill="#555">coverage still climbs to 100% of populated cells even though its slice F1 is</text>
<text x="70" y="754.0" font-size="11.5" fill="#555">worst. Tier 1's share is a tiny 2 cells — consistent with its 0.34 F1, not</text>
<text x="70" y="770.0" font-size="11.5" fill="#555">dressed up. The 123 genuinely-blank cells are an explicit remainder.</text>
