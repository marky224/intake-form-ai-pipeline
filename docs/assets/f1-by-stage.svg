<text x="70" y="674.0" font-size="11.5" fill="#555">Tier 3 re-reads every field Tier 2 handled; agreement sets confidence.</text>
<text x="70" y="690.0" font-size="11.5" fill="#555">A mismatch parks for review and keeps Tier 2's value if it validates</text>
<text x="70" y="706.0" font-size="11.5" fill="#555">(date, ZIP, state, phone) or Tier 3 read nothing, else Tier 3's. Most of</text>
<text x="70" y="722.0" font-size="11.5" fill="#555">the gain is Synthea's number-suffixed names (Tier 3 copies "Ramona980"</text>
<text x="70" y="738.0" font-size="11.5" fill="#555">literally), offset by street addresses (-37 cells, kept). The rule was</text>
<text x="70" y="754.0" font-size="11.5" fill="#555">chosen after test-split results were seen. Before 2026-10-16: 0.765.</text>
<text x="690" y="770" text-anchor="end" font-size="11" fill="#999">alias_table_seed v1.0.0</text>
