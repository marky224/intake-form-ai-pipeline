<text x="70" y="360.0" font-size="11.5" fill="#555">blanks, 0 failed validator).</text>
<text x="70" y="376.0" font-size="11.5" fill="#555">Empty cells, shown explicitly: 92 missed (value on the form, none extracted) + 23 blank on the form.</text>
