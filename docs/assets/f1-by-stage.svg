<text x="70" y="296.0" font-size="11.5" fill="#555">Cells resolved by tier ≤ N (cumulative), by the tier whose value was kept. Tier 1's</text>
<text x="70" y="312.0" font-size="11.5" fill="#555">share is a tiny 2 cells — consistent with its 0.34 F1. Tier 3 re-reads every Tier-2</text>
<text x="70" y="328.0" font-size="11.5" fill="#555">field; its value is kept where the readings differ, it read something, and Tier 2's</text>
<text x="70" y="344.0" font-size="11.5" fill="#555">value doesn't validate (167 cells: 158 free text with no validator, 8 Tier-2</text>
<text x="70" y="360.0" font-size="11.5" fill="#555">blanks, 1 failed validator).</text>
<text x="70" y="376.0" font-size="11.5" fill="#555">Empty cells, shown explicitly: 92 missed (value on the form, none extracted) + 23 blank on the form.</text>
