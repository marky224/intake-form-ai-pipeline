<text x="18" y="150.0" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 18 150.0)">cells resolved</text>
<text x="70" y="296.0" font-size="11.5" fill="#555">Cells resolved by tier ≤ N (cumulative). Tier 3 only ever finalizes the</text>
<text x="70" y="312.0" font-size="11.5" fill="#555">residual the earlier tiers couldn't clear (the forced-escalated dates), so</text>
<text x="70" y="328.0" font-size="11.5" fill="#555">coverage still climbs to 100% of populated cells even though its slice F1 is</text>
<text x="70" y="344.0" font-size="11.5" fill="#555">worst. Tier 1's share is a tiny 2 cells — consistent with its 0.34 F1, not</text>
<text x="70" y="360.0" font-size="11.5" fill="#555">dressed up. The 123 genuinely-blank cells are an explicit remainder.</text>
<text x="360.0" y="404" text-anchor="middle" font-size="18" font-weight="bold">F1 by cumulative cascade stage (same run)</text>
