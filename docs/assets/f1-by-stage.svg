<text x="70" y="322.0" font-size="11.5" fill="#555">Tier 3 only re-extracts fields that escalated (confidence &lt; 0.80).</text>
<text x="70" y="338.0" font-size="11.5" fill="#555">The locked 0.5-confidence heuristic on coerced scalars forces every</text>
<text x="70" y="354.0" font-size="11.5" fill="#555">date field to escalate even when Tier 2 had it right — and the</text>
<text x="70" y="370.0" font-size="11.5" fill="#555">Q4_K_M 32B re-extracts those dates worse than the 7B, overwriting</text>
<text x="70" y="386.0" font-size="11.5" fill="#555">correct values (29/31 changed fields: correct → wrong, ~all dates).</text>
<text x="70" y="402.0" font-size="11.5" fill="#555">Shipped honest: motivates the local Qwen3-VL Tier-3b upgrade.</text>
