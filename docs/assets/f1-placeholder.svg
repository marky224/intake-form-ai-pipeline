<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="F1-over-time placeholder. Real data lands in Phase 6.">
  <title>F1-over-time placeholder</title>
  <desc>Placeholder for the F1-over-time chart. Real eval data lands in Phase 6 of the build.</desc>

  <!-- Background -->
  <rect width="720" height="360" fill="#fafafa"/>

  <!-- Plot area border -->
  <rect x="80" y="40" width="600" height="260" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>

  <!-- Y-axis grid lines and labels -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#666">
    <line x1="80" y1="40" x2="680" y2="40" stroke="#eeeeee" stroke-width="1"/>
    <text x="72" y="44" text-anchor="end">1.0</text>

    <line x1="80" y1="105" x2="680" y2="105" stroke="#eeeeee" stroke-width="1"/>
    <text x="72" y="109" text-anchor="end">0.9</text>

    <line x1="80" y1="170" x2="680" y2="170" stroke="#eeeeee" stroke-width="1"/>
    <text x="72" y="174" text-anchor="end">0.8</text>

    <line x1="80" y1="235" x2="680" y2="235" stroke="#eeeeee" stroke-width="1"/>
    <text x="72" y="239" text-anchor="end">0.7</text>

    <text x="72" y="304" text-anchor="end">0.6</text>
  </g>

  <!-- X-axis tick marks and labels -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#666">
    <line x1="140" y1="300" x2="140" y2="305" stroke="#999"/>
    <text x="140" y="320" text-anchor="middle">1</text>

    <line x1="260" y1="300" x2="260" y2="305" stroke="#999"/>
    <text x="260" y="320" text-anchor="middle">3</text>

    <line x1="380" y1="300" x2="380" y2="305" stroke="#999"/>
    <text x="380" y="320" text-anchor="middle">5</text>

    <line x1="500" y1="300" x2="500" y2="305" stroke="#999"/>
    <text x="500" y="320" text-anchor="middle">7</text>

    <line x1="620" y1="300" x2="620" y2="305" stroke="#999"/>
    <text x="620" y="320" text-anchor="middle">9</text>
  </g>

  <!-- Axis labels -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#444" font-weight="500">
    <text x="380" y="345" text-anchor="middle">Eval batch</text>
    <text x="30" y="170" text-anchor="middle" transform="rotate(-90, 30, 170)">F1 score</text>
  </g>

  <!-- Placeholder annotation -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="380" y="160" text-anchor="middle" font-size="16" fill="#999" font-weight="500">
      Data lands in Phase 6
    </text>
    <text x="380" y="185" text-anchor="middle" font-size="12" fill="#bbb">
      Eval harness in development
    </text>
  </g>

  <!-- Subtle "in development" badge in corner -->
  <g transform="translate(620, 20)">
    <rect x="0" y="0" width="80" height="20" rx="3" fill="#fff8e1" stroke="#f0c000" stroke-width="1"/>
    <text x="40" y="14" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#806000" font-weight="500">
      placeholder
    </text>
  </g>
</svg>
